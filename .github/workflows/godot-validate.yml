name: Godot Project Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and scene smoke test (Godot 4.7)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 libasound2t64

      - name: Download and verify Godot 4.7
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --version

      - name: Import project resources and parse scripts
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path . --import --quit --verbose 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Instantiate main scene and run smoke test
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://tests/smoke_test.gd --verbose 2>&1 | tee "$RUNNER_TEMP/godot-smoke-test.log"

      - name: Upload Godot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-smoke-test.log
          if-no-files-found: warn
          retention-days: 7
