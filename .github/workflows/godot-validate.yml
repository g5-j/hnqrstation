name: Godot Project Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project with Godot 4.7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v4.7-stable_linux.x86_64"
          echo "GODOT=$GODOT_DIR/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
          "$GODOT_DIR/Godot_v4.7-stable_linux.x86_64" --version

      - name: Import resources and validate scripts
        shell: bash
        run: |
          set -uo pipefail
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -uo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/godot-smoke-test.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-smoke-test.log
          if-no-files-found: warn
          retention-days: 7
